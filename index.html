const root=document.getElementById('modules'),stats=document.getElementById('stats'),search=document.getElementById('search');const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();function draw(){const q=norm(search.value.trim());root.replaceChildren();let count=0,lessons=0;modules.forEach(m=>{const matchModule=norm(m.title+' modulo '+m.num).includes(q);const shown=matchModule?m.lessons:m.lessons.filter(l=>norm(l.title).includes(q));if(q&&!matchModule&&!shown.length)return;count++;lessons+=shown.length;const d=document.createElement('details');d.className='module';d.open=!!q;const sum=document.createElement('summary');const number=document.createElement('span');number.className='number';number.textContent='MÓDULO '+String(m.num).padStart(2,'0');const meta=document.createElement('div');meta.className='meta';const title=document.createElement('div');title.className='name';title.textContent=m.title;const qty=document.createElement('div');qty.className='count';qty.textContent=m.lessons.length+' '+(m.lessons.length===1?'item':'itens');meta.append(title,qty);const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='⌄';sum.append(number,meta,arrow);d.append(sum);const body=document.createElement('div');body.className='lessons';shown.forEach(l=>{const line=document.createElement('div');line.className='lesson';const num=document.createElement('span');num.className='lessonnum';num.textContent=String(l.n).padStart(2,'0');const txt=document.createElement('span');txt.className='lessonname';txt.textContent=l.title;line.append(num,txt);body.append(line)});d.append(body);root.append(d)});stats.textContent=count+' módulos exibidos · '+lessons+' itens';if(!count){const e=document.createElement('div');e.className='empty';e.textContent='Nenhum módulo ou aula encontrado.';root.append(e)}}search.addEventListener('input',draw);document.getElementById('expand').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=true);document.getElementById('collapse').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);draw();</script></body></html>
